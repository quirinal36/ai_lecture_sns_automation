<!DOCTYPE html>
<html lang="ko" data-resolution="portrait">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920">
    <title>블루베리, 나의 저속노화 비법</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Noto Sans KR";
        src: url("./assets/fonts/NotoSansKR-VF.ttf") format("truetype");
        font-style: normal;
        font-weight: 100 900;
        font-display: block;
      }

      :root {
        --purple: #3b165f;
        --yellow: #ffd84d;
        --cream: #fff2d6;
        --shadow: rgba(32, 14, 48, 0.38);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        width: 1080px;
        height: 1920px;
        margin: 0;
        overflow: hidden;
        background: #000;
      }

      #stage {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        font-family: "Noto Sans KR", sans-serif;
      }

      .clip {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      .background-photo {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center center;
      }

      .title-box {
        position: absolute;
        inset: 0;
        width: 860px;
        height: 400px;
        margin: auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        text-align: center;
        pointer-events: none;
      }

      .title-line {
        display: flex;
        align-items: baseline;
        justify-content: center;
        width: 100%;
        margin: 0;
        white-space: nowrap;
        letter-spacing: -0.045em;
        text-shadow: 0 5px 18px var(--shadow);
        will-change: transform;
        opacity: 0;
      }

      .title-line--one {
        position: relative;
        isolation: isolate;
        min-height: 142px;
        color: var(--purple);
        font-size: 132px;
        font-weight: 900;
        line-height: 1;
      }

      .title-line--one::before {
        content: "";
        position: absolute;
        inset: -10px 0 -12px;
        z-index: 0;
        border: 2px solid rgba(255, 255, 255, 0.45);
        border-radius: 24px;
        background: rgba(255, 242, 214, 0.9);
        box-shadow: 0 12px 32px rgba(22, 9, 34, 0.2);
      }

      .title-line--two {
        position: relative;
        isolation: isolate;
        min-height: 108px;
        color: var(--cream);
        font-size: 88px;
        font-weight: 800;
        line-height: 1.05;
      }

      .title-line--two::before {
        content: "";
        position: absolute;
        inset: -10px 0 -14px;
        z-index: 0;
        border: 2px solid rgba(255, 255, 255, 0.2);
        border-radius: 24px;
        background: rgba(36, 16, 58, 0.82);
        box-shadow: 0 12px 32px rgba(22, 9, 34, 0.24);
      }

      .word {
        position: relative;
        z-index: 1;
        display: inline-block;
        transform-origin: 50% 50%;
        will-change: transform;
      }

      .word--blueberry {
        color: var(--purple);
      }

      .word--slow-aging {
        color: var(--yellow);
        margin: 0 0.08em;
      }

      .underline {
        position: absolute;
        left: 0;
        top: calc(100% + 10px);
        width: 100%;
        height: 18px;
        overflow: visible;
        pointer-events: none;
      }

      .underline path {
        fill: none;
        stroke: var(--yellow);
        stroke-width: 8;
        stroke-linecap: round;
        stroke-linejoin: round;
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <main data-hf-id="hf-ksql" id="stage" data-composition-id="blueberry-slow-aging-title" data-start="0" data-duration="6" data-fps="30" data-width="1080" data-height="1920">
      <section data-hf-id="hf-lhzq" id="title-over-photo" class="clip" data-start="0" data-duration="6" data-track-index="0" aria-label="블루베리 피킹 사진 위 타이틀">
        <img data-hf-id="hf-58dh" id="blueberry-photo" class="background-photo" src=".media/images/image_001.png" alt="블루베리를 따는 사람">

        <div data-hf-id="hf-u5uy" class="title-box">
          <p data-hf-id="hf-gccr" id="title-line-one" class="title-line title-line--one">
            <span data-hf-id="hf-6aqy" id="word-blueberry" class="word word--blueberry" data-layout-allow-overlap="true">블루베리,</span>
          </p>
          <p data-hf-id="hf-63p7" id="title-line-two" class="title-line title-line--two">
            <span data-hf-id="hf-a7ih" class="word">나의</span>
            <span data-hf-id="hf-yc1b" id="word-slow-aging" class="word word--slow-aging">
              저속노화
              <svg data-hf-id="hf-068t" class="underline" viewBox="0 0 100 18" preserveAspectRatio="none" aria-hidden="true">
                <path data-hf-id="hf-bmkq" id="slow-aging-underline" d="M 2 9 C 24 5.5, 49 11.5, 70 7.5 C 82 5.8, 92 9.5, 98 7" />
              </svg>
            </span>
            <span data-hf-id="hf-nd0u" class="word">비법</span>
          </p>
        </div>
      </section>
    </main>

    <script>
      (function () {
        "use strict";

        var underline = document.getElementById("slow-aging-underline");
        var underlineLength = underline.getTotalLength();
        underline.style.strokeDasharray = String(underlineLength);
        underline.style.strokeDashoffset = String(underlineLength);

        var tl = gsap.timeline({ paused: true });

        // Registry line-by-line slide adapted into a vertical, binary waterfall.
        tl.set("#title-line-one", { opacity: 1 }, 0.2);
        tl.fromTo(
          "#title-line-one",
          { y: 72 },
          { y: 0, duration: 0.5, ease: "power4.out" },
          0.2,
        );

        tl.set("#title-line-two", { opacity: 1 }, 0.47);
        tl.fromTo(
          "#title-line-two",
          { y: 48 },
          { y: 0, duration: 0.55, ease: "power4.out" },
          0.47,
        );

        // Restrained spring-pop treatment on emphasis words only.
        tl.set("#word-blueberry", { scale: 0.88 }, 0.2);
        tl.to(
          "#word-blueberry",
          { scale: 1.04, duration: 0.32, ease: "power3.out" },
          0.5,
        );
        tl.to(
          "#word-blueberry",
          { scale: 1, duration: 0.16, ease: "sine.inOut" },
          0.83,
        );

        tl.set("#word-slow-aging", { scale: 0.88 }, 0.47);
        tl.to(
          "#word-slow-aging",
          { scale: 1.04, duration: 0.32, ease: "power3.out" },
          0.92,
        );
        tl.to(
          "#word-slow-aging",
          { scale: 1, duration: 0.16, ease: "sine.inOut" },
          1.24,
        );

        // Marker-highlight underline mode, using measured SVG path geometry.
        tl.set(underline, { opacity: 1 }, 1.2);
        tl.fromTo(
          underline,
          { strokeDashoffset: underlineLength },
          { strokeDashoffset: 0, duration: 0.48, ease: "power2.out" },
          1.2,
        );

        // One pattern interrupt, then a motionless final hold through 6.0s.
        tl.fromTo(
          "#word-slow-aging",
          { scale: 1 },
          { scale: 1.03, duration: 0.18, ease: "sine.out" },
          3.4,
        );
        tl.to(
          "#word-slow-aging",
          { scale: 1, duration: 0.2, ease: "sine.inOut" },
          3.58,
        );

        window.__timelines["blueberry-slow-aging-title"] = tl;
        tl.seek(0);
      })();
    </script>
  </body>
</html>
